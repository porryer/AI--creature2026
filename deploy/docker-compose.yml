# 造物 Creature staging 编排：PostgreSQL + 后端 + 用户端（nginx），可选 MinIO 对象存储
#   cp .env.example .env   # 按说明填写密钥
#   docker compose up -d --build
#   打开 http://localhost:8080
# 使用对象存储：在 .env 中设置 STORAGE_DRIVER=s3 与 S3_*（见 .env.example），然后 docker compose --profile s3 up -d
# 基础镜像可在 .env 中换成镜像站地址（见 .env.example）
name: creature-staging

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: creature
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: creature
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creature -d creature']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: creature-server:staging
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: staging
      DATABASE_URL: postgres://creature:${POSTGRES_PASSWORD}@db:5432/creature
      STORAGE_DIR: /data/files
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # 本地 staging 通过 http 访问；部署到 https 域名后改为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  # S3 兼容对象存储（只在 --profile s3 时启动）；浏览器直接上传与读取，因此端口需要对外可访问（S3_PUBLIC_ENDPOINT）
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ['s3']
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-creature}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - '${MINIO_PORT:-9000}:9000'
    volumes:
      - minio-data:/data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: creature-web:staging
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  files:
  minio-data:
