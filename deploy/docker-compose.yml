# 造物 Creature staging 编排：PostgreSQL + 后端 + 用户端（nginx）
#   cp .env.example .env   # 按说明填写密钥
#   docker compose up -d --build
#   打开 http://localhost:8080
# 基础镜像可在 .env 中换成镜像站地址（见 .env.example）
name: creature-staging

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: creature
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: creature
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creature -d creature']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: creature-server:staging
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: staging
      DATABASE_URL: postgres://creature:${POSTGRES_PASSWORD}@db:5432/creature
      STORAGE_DIR: /data/files
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # 本地 staging 通过 http 访问；部署到 https 域名后改为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: creature-web:staging
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  files:
