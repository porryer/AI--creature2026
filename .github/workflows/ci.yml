name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 类型检查 · 测试（PGlite）· 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo -w @creature/web

  postgres:
    name: 后端测试（PostgreSQL 16）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creature
          POSTGRES_PASSWORD: creature
          POSTGRES_DB: creature_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U creature"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @creature/server
        env:
          TEST_DATABASE_URL: postgres://creature:creature@localhost:5432/creature_test

  images:
    name: 构建容器镜像（后端 · 用户端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t creature-server:ci .
      - run: docker build -f apps/web/Dockerfile -t creature-web:ci .
      # 冒烟：镜像能以 staging 配置启动并通过健康检查
      - name: staging 编排冒烟测试
        working-directory: deploy
        run: |
          cp .env.example .env
          for k in POSTGRES_PASSWORD JWT_SECRET PHONE_ENC_KEY PHONE_HASH_KEY FILE_SIGNING_SECRET METRICS_TOKEN; do
            sed -i "s|^$k=$|$k=$(openssl rand -hex 32)|" .env
          done
          docker tag creature-server:ci creature-server:staging
          docker tag creature-web:ci creature-web:staging
          docker compose up -d --no-build --wait
          curl -fsS http://localhost:8080/v1/healthz
          curl -fsS -o /dev/null http://localhost:8080/
          docker compose down -v
